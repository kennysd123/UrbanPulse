<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker>
  <marker id="dep" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b4ab5"/></marker>
  <style>
    .title{font:700 25px Arial,sans-serif;fill:#17202a}.subtitle{font:15px Arial,sans-serif;fill:#4a5568}
    .layer{stroke:#555;stroke-width:1.5}.head{font:700 18px Arial,sans-serif;fill:#17202a}.small{font:13px Arial,sans-serif;fill:#263238}
    .box{fill:#fff;stroke:#3b82f6;stroke-width:1.4}.module{fill:#f8fbff;stroke:#4a90e2;stroke-width:1.2}
    .domain{fill:#fff8df;stroke:#e5a900;stroke-width:1.4}.infra{fill:#f6efff;stroke:#8b5cc7;stroke-width:1.4}
    .app{fill:#eefbf0;stroke:#55a968;stroke-width:1.4}.pres{fill:#eaf4ff;stroke:#5a9bd5;stroke-width:1.4}
    .ext{fill:#f1f1f1;stroke:#777;stroke-width:1.4}.db{fill:#fff8df;stroke:#c28a00;stroke-width:1.4}
    .arrow{stroke:#333;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7b4ab5;stroke-width:1.7;stroke-dasharray:7 5;fill:none;marker-end:url(#dep)}
  </style>
</defs>
<rect width="1600" height="1050" fill="#fff"/>
<text x="45" y="42" class="title">UrbanPulse — Enfoque arquitectónico</text>
<text x="45" y="68" class="subtitle">Clean Architecture aplicada dentro de un Monolito Modular</text>

<!-- actors -->
<rect x="470" y="88" width="660" height="76" rx="12" fill="#eef7ff" stroke="#5a9bd5" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" class="head">Actores</text>
<text x="575" y="145" text-anchor="middle" class="small">Cliente</text>
<text x="800" y="145" text-anchor="middle" class="small">Propietario</text>
<text x="1025" y="145" text-anchor="middle" class="small">Administrador</text>
<line x1="800" y1="164" x2="800" y2="188" class="arrow"/>

<rect x="560" y="188" width="480" height="65" rx="12" class="pres"/>
<text x="800" y="216" text-anchor="middle" class="head">Aplicación Web</text>
<text x="800" y="239" text-anchor="middle" class="small">Interfaz de interacción de UrbanPulse</text>
<line x1="800" y1="253" x2="800" y2="286" class="arrow"/>
<text x="812" y="276" class="small">HTTPS / JSON</text>

<!-- monolith boundary -->
<rect x="35" y="278" width="1110" height="600" rx="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 7"/>
<text x="55" y="308" class="head">Monolito Modular UrbanPulse</text>
<text x="55" y="330" class="subtitle">Una aplicación desplegable con módulos de negocio separados</text>

<!-- presentation -->
<rect x="60" y="345" width="1060" height="105" rx="10" class="layer pres"/>
<text x="80" y="373" class="head">1. PRESENTACIÓN</text>
<text x="80" y="395" class="small">Expone la API REST y recibe las solicitudes de los actores.</text>
<rect x="350" y="360" width="720" height="70" rx="8" class="box"/>
<text x="710" y="387" text-anchor="middle" class="head">API REST</text>
<text x="710" y="411" text-anchor="middle" class="small">Usuarios · Establecimientos · Recursos · Disponibilidad · Reservas · Solicitudes · Servicios · Pagos</text>

<!-- application -->
<rect x="60" y="465" width="1060" height="125" rx="10" class="layer app"/>
<text x="80" y="493" class="head">2. APLICACIÓN</text>
<text x="80" y="515" class="small">Coordina los casos de uso sin contener detalles tecnológicos.</text>
<g>
<rect x="330" y="480" width="150" height="88" rx="7" class="module"/><text x="405" y="507" text-anchor="middle" class="small">Usuarios</text><text x="405" y="528" text-anchor="middle" class="small">casos de uso</text><text x="405" y="549" text-anchor="middle" class="small">acceso y roles</text>
<rect x="495" y="480" width="170" height="88" rx="7" class="module"/><text x="580" y="507" text-anchor="middle" class="small">Establecimientos</text><text x="580" y="528" text-anchor="middle" class="small">casos de uso</text><text x="580" y="549" text-anchor="middle" class="small">gestión</text>
<rect x="680" y="480" width="145" height="88" rx="7" class="module"/><text x="752" y="507" text-anchor="middle" class="small">Disponibilidad</text><text x="752" y="528" text-anchor="middle" class="small">consulta y</text><text x="752" y="549" text-anchor="middle" class="small">validación</text>
<rect x="840" y="480" width="130" height="88" rx="7" class="module"/><text x="905" y="507" text-anchor="middle" class="small">Reservas</text><text x="905" y="528" text-anchor="middle" class="small">crear · confirmar</text><text x="905" y="549" text-anchor="middle" class="small">· cancelar</text>
<rect x="985" y="480" width="110" height="88" rx="7" class="module"/><text x="1040" y="507" text-anchor="middle" class="small">Pagos</text><text x="1040" y="528" text-anchor="middle" class="small">adelantos</text><text x="1040" y="549" text-anchor="middle" class="small">simulados</text>
</g>

<!-- domain -->
<rect x="60" y="605" width="1060" height="145" rx="10" class="layer domain"/>
<text x="80" y="633" class="head">3. DOMINIO</text>
<text x="80" y="655" class="small">Núcleo de reglas de negocio, entidades y contratos.</text>
<g>
<rect x="320" y="620" width="135" height="55" rx="7" class="domain"/><text x="387" y="642" text-anchor="middle" class="small">Usuario</text><text x="387" y="660" text-anchor="middle" class="small">roles</text>
<rect x="470" y="620" width="155" height="55" rx="7" class="domain"/><text x="547" y="642" text-anchor="middle" class="small">Establecimiento</text><text x="547" y="660" text-anchor="middle" class="small">categoría</text>
<rect x="640" y="620" width="130" height="55" rx="7" class="domain"/><text x="705" y="642" text-anchor="middle" class="small">Recurso</text><text x="705" y="660" text-anchor="middle" class="small">capacidad</text>
<rect x="785" y="620" width="145" height="55" rx="7" class="domain"/><text x="857" y="642" text-anchor="middle" class="small">Disponibilidad</text><text x="857" y="660" text-anchor="middle" class="small">horarios</text>
<rect x="945" y="620" width="145" height="55" rx="7" class="domain"/><text x="1017" y="642" text-anchor="middle" class="small">Reserva / Pago</text><text x="1017" y="660" text-anchor="middle" class="small">reglas y estados</text>
<rect x="430" y="690" width="250" height="42" rx="7" class="domain"/><text x="555" y="716" text-anchor="middle" class="small">Puertos: repositorios</text>
<rect x="705" y="690" width="300" height="42" rx="7" class="domain"/><text x="855" y="716" text-anchor="middle" class="small">Puertos: mapas · comunicación · pago</text>
</g>

<!-- infra -->
<rect x="60" y="765" width="1060" height="90" rx="10" class="layer infra"/>
<text x="80" y="793" class="head">4. INFRAESTRUCTURA</text>
<text x="80" y="815" class="small">Implementa los contratos y conecta tecnologías externas.</text>
<rect x="390" y="782" width="180" height="52" rx="7" class="module"/><text x="480" y="805" text-anchor="middle" class="small">Repositorios</text><text x="480" y="822" text-anchor="middle" class="small">persistencia</text>
<rect x="590" y="782" width="180" height="52" rx="7" class="module"/><text x="680" y="805" text-anchor="middle" class="small">Adaptador de mapas</text><text x="680" y="822" text-anchor="middle" class="small">proveedor externo</text>
<rect x="790" y="782" width="145" height="52" rx="7" class="module"/><text x="862" y="805" text-anchor="middle" class="small">WhatsApp</text><text x="862" y="822" text-anchor="middle" class="small">redirección</text>
<rect x="955" y="782" width="145" height="52" rx="7" class="module"/><text x="1027" y="805" text-anchor="middle" class="small">Pago simulado</text><text x="1027" y="822" text-anchor="middle" class="small">adelanto</text>

<!-- execution arrows -->
<line x1="710" y1="430" x2="710" y2="480" class="arrow"/>
<line x1="710" y1="568" x2="710" y2="620" class="arrow"/>

<!-- dependency inversion -->
<path d="M480 782 L480 735 L555 735 L555 732" class="dashed"/>
<path d="M680 782 L680 745 L855 745 L855 732" class="dashed"/>
<path d="M862 782 L862 750 L855 750 L855 732" class="dashed"/>
<path d="M1027 782 L1027 750 L855 750" class="dashed"/>

<!-- db -->
<ellipse cx="575" cy="925" rx="130" ry="28" class="db"/>
<rect x="445" y="925" width="260" height="65" class="db"/>
<ellipse cx="575" cy="990" rx="130" ry="28" class="db"/>
<text x="575" y="953" text-anchor="middle" class="head">Base de datos relacional</text>
<text x="575" y="976" text-anchor="middle" class="small">Persistencia de UrbanPulse</text>
<line x1="480" y1="834" x2="575" y2="925" class="arrow"/>
<text x="500" y="885" class="small">Persistencia</text>

<!-- external systems -->
<rect x="1190" y="278" width="360" height="600" rx="10" fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="9 6"/>
<text x="1215" y="310" class="head">Sistemas externos</text>
<rect x="1220" y="345" width="300" height="105" rx="10" class="ext"/>
<text x="1370" y="380" text-anchor="middle" class="head">Proveedor de mapas</text>
<text x="1370" y="405" text-anchor="middle" class="small">Visualización de ubicación</text>
<text x="1370" y="426" text-anchor="middle" class="small">proveedor concreto pendiente</text>
<rect x="1220" y="485" width="300" height="105" rx="10" class="ext"/>
<text x="1370" y="520" text-anchor="middle" class="head">WhatsApp</text>
<text x="1370" y="545" text-anchor="middle" class="small">Contacto con propietario</text>
<text x="1370" y="566" text-anchor="middle" class="small">redirección fuera de UrbanPulse</text>
<rect x="1220" y="625" width="300" height="105" rx="10" class="ext"/>
<text x="1370" y="660" text-anchor="middle" class="head">Servicio de pago simulado</text>
<text x="1370" y="685" text-anchor="middle" class="small">Aprobado / Rechazado</text>
<text x="1370" y="706" text-anchor="middle" class="small">adelanto durante el MVP</text>
<path d="M1095 805 C1160 805 1160 400 1220 400" class="arrow"/>
<path d="M935 805 C1150 805 1150 540 1220 540" class="arrow"/>
<path d="M1100 805 C1165 805 1165 680 1220 680" class="arrow"/>

<!-- legend -->
<rect x="35" y="1015" width="1110" height="25" fill="#fff"/>
<line x1="55" y1="1028" x2="115" y2="1028" class="arrow"/><text x="125" y="1033" class="small">Flujo de ejecución</text>
<line x1="300" y1="1028" x2="360" y2="1028" class="dashed"/><text x="370" y="1033" class="small">Dependencia / inversión de dependencia</text>
<rect x="640" y="1020" width="20" height="15" class="ext"/><text x="670" y="1033" class="small">Sistema externo</text>

<text x="1190" y="930" class="head">Reglas del enfoque</text>
<text x="1190" y="955" class="small">1. El dominio no depende de tecnologías externas.</text>
<text x="1190" y="977" class="small">2. Aplicación coordina casos de uso.</text>
<text x="1190" y="999" class="small">3. Infraestructura implementa puertos.</text>
<text x="1190" y="1021" class="small">4. Las modalidades mantienen reglas diferenciadas.</text>
</svg>